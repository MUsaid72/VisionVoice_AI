# ==============================================================================
# Hardened Nginx Reverse Proxy Configuration for VisionVoice AI
# Security Protections:
# - SSL/TLS 1.2 & 1.3 Termination with Perfect Forward Secrecy (PFS)
# - DoS Mitigation: IP-Based Rate Limiting (10 requests/sec with burst buffer)
# - Buffer Overflow & Memory Exhaustion Protection (client_max_body_size 16M)
# - HTTP Security Headers (HSTS, CSP, X-Frame-Options, No-Sniff)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from attackers (OWASP A05)
    server_tokens off;

    # Rate Limiting Zone: 10MB memory holds ~160,000 IP addresses
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    upstream flask_app {
        server app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        # Enforce HTTPS redirect
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # SSL Certificates (Let's Encrypt / Certbot)
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Modern Cryptographic Standards
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Maximum payload ceiling (Prevents memory exhaustion)
        client_max_body_size 16M;

        # Defense-in-Depth HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve static assets directly (High performance, bypasses Python)
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Reverse Proxy to Gunicorn WSGI with Rate Limiting
        location / {
            limit_req zone=apilimit burst=20 nodelay;

            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
