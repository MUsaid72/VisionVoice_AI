version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-default_secure_random_key_change_in_env}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - sqlite_data:/app/database_store
    networks:
      - internal_network
    read_only: false
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal_network

volumes:
  sqlite_data:
  certs:

networks:
  internal_network:
    driver: bridge
